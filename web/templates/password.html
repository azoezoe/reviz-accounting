{{define "content"}}
<div class="lg-page-head">
  <div class="lg-page-head__title-block">
    <span class="lg-page-eyebrow">PROFILE</span>
    <h1 class="lg-page-title">變更密碼<span class="lg-page-title__suffix">Password</span></h1>
    <p style="margin:0; font-family:var(--font-body-cn); color:var(--text-muted); font-size:14px;">更新後，所有已登入裝置都會被登出。</p>
  </div>
</div>

<section class="lg-panel" style="max-width:640px;">
  <div class="lg-panel__head">
    <div>
      <h3 class="lg-panel__title">設定新密碼</h3>
      <p class="lg-panel__sub">新密碼至少需要 6 個字元。</p>
    </div>
  </div>
  {{if .Error}}<div class="lg-tip" style="margin:0 0 18px; border-color:var(--danger-300); color:var(--danger-700);">{{.Error}}</div>{{end}}
  <form method="post" action="/profile/password" style="display:grid; gap:16px;">
    <div class="lg-field">
      <label class="lg-field__label">目前密碼</label>
      <input class="lg-input" type="password" name="current_password" autocomplete="current-password" required autofocus>
    </div>
    <div class="lg-field">
      <label class="lg-field__label">新密碼</label>
      <input class="lg-input" type="password" name="new_password" autocomplete="new-password" minlength="6" required>
    </div>
    <div class="lg-field">
      <label class="lg-field__label">確認新密碼</label>
      <input class="lg-input" type="password" name="confirm_password" autocomplete="new-password" minlength="6" required>
    </div>
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <a class="lg-btn-secondary" href="/dashboard">取消</a>
      <button class="lg-btn-primary" type="submit">更新密碼</button>
    </div>
  </form>
</section>
{{end}}
